name: Patch H3 notebook

on:
  workflow_dispatch:
  push:
    paths:
      - tools/patch_h3_notebook.py
      - .github/workflows/patch-h3-notebook.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply the acceleration patch
        run: python "tools/patch_h3_notebook.py"

      - name: Validate notebook JSON
        run: python -c "import json,sys; nb=json.load(open('MiniMax_H3_Director_Colab_Pro_v4 (2).ipynb',encoding='utf-8')); print(nb['nbformat'], len(nb['cells']), 'cells')"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "notebook already up to date"
          else
            git commit -m "chore: wire Director acceleration module into the v4 notebook"
            git push
          fi
